<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Anchorage 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap');
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --cyan: #00f2ff;
            --cyan-dim: rgba(0,242,255,0.5);
            --cyan-glass: rgba(0,242,255,0.07);
            --ocean: #00050a;
            --ocean-card: #000d1a;
            --border: rgba(0,242,255,0.2);
            --border-bright: rgba(0,242,255,0.5);
            --error: #ff4466;
            --success: #00ff88;
            --expo: cubic-bezier(0.19,1,0.22,1);
        }
        html { scroll-behavior: smooth; height: 100%; }
        body {
            background: var(--ocean);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* ── BG ── */
        #bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: #000810; }
        .grid-bg {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(0,242,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,242,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        .glow-orb { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; }
        .glow-orb-1 { width: 600px; height: 600px; background: rgba(0,100,150,0.18); top: -200px; left: -200px; }
        .glow-orb-2 { width: 500px; height: 500px; background: rgba(0,60,100,0.15); bottom: -150px; right: -100px; }
        .scan-line {
            position: absolute; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,242,255,0.4), transparent);
            animation: scan 6s ease-in-out infinite;
        }
        @keyframes scan { 0% { top: -5%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 0.4; } 100% { top: 105%; opacity: 0; } }
        .radar-ring {
            position: absolute; top: 50%; left: 50%; border-radius: 50%;
            border: 1px solid rgba(0,242,255,0.04);
            animation: rping 10s linear infinite;
        }
        @keyframes rping { 0% { width: 0; height: 0; transform: translate(-50%,-50%); opacity: 0.6; } 100% { width: 200vmax; height: 200vmax; transform: translate(-50%,-50%); opacity: 0; } }

        /* ── NAV ── */
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            height: 60px;
            background: rgba(0,5,10,0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px;
        }
        .nav-brand {
            font-family: 'Orbitron'; font-size: 0.72rem; letter-spacing: 4px;
            color: var(--cyan); text-decoration: none;
            text-shadow: 0 0 14px rgba(0,242,255,0.4);
        }
        .nav-links-right { display: flex; gap: 16px; align-items: center; }
        .nav-links-right a {
            font-family: 'Orbitron'; font-size: 0.55rem; letter-spacing: 3px;
            color: rgba(255,255,255,0.45); text-decoration: none;
            transition: color 0.3s;
        }
        .nav-links-right a:hover { color: var(--cyan); }
        .nav-cta {
            border: 1px solid var(--cyan); padding: 6px 16px;
            color: var(--cyan) !important;
            clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
            transition: background 0.3s !important;
        }
        .nav-cta:hover { background: var(--cyan) !important; color: #000 !important; }

        /* ── CARD ── */
        .login-wrap { width: 100%; max-width: 460px; padding: 20px 16px; margin-top: 60px; }
        .login-card {
            background: rgba(0,13,26,0.9);
            border: 1px solid var(--border);
            padding: 40px 32px;
            position: relative; overflow: hidden;
            animation: cardIn 0.8s var(--expo) forwards;
        }
        @keyframes cardIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
        }
        .corner { position: absolute; width: 20px; height: 20px; }
        .corner-tl { top: 0; left: 0; border-top: 1px solid var(--cyan); border-left: 1px solid var(--cyan); }
        .corner-tr { top: 0; right: 0; border-top: 1px solid var(--cyan); border-right: 1px solid var(--cyan); }
        .corner-bl { bottom: 0; left: 0; border-bottom: 1px solid var(--cyan); border-left: 1px solid var(--cyan); }
        .corner-br { bottom: 0; right: 0; border-bottom: 1px solid var(--cyan); border-right: 1px solid var(--cyan); }

        .card-tag {
            font-family: 'Share Tech Mono'; font-size: 0.55rem; letter-spacing: 5px;
            color: var(--cyan); opacity: 0.55; display: block; margin-bottom: 10px;
            text-align: center;
        }
        .card-title {
            font-family: 'Orbitron'; font-size: clamp(1.4rem,5vw,1.9rem);
            font-weight: 700; letter-spacing: 4px; text-align: center;
            background: linear-gradient(135deg, #fff 30%, var(--cyan) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 6px;
        }
        .card-sub {
            font-size: 0.82rem; color: rgba(255,255,255,0.35); letter-spacing: 1.5px;
            text-align: center; margin-bottom: 32px; line-height: 1.5;
        }

        /* ── FORM ── */
        .field { margin-bottom: 20px; position: relative; }
        .field label {
            font-family: 'Orbitron'; font-size: 0.48rem; letter-spacing: 3px;
            color: var(--cyan); opacity: 0.7; display: block; margin-bottom: 8px;
        }
        .field input {
            width: 100%; background: rgba(0,242,255,0.04);
            border: 1px solid var(--border); color: #fff;
            font-family: 'Rajdhani'; font-size: 0.95rem; letter-spacing: 1px;
            padding: 12px 16px; outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .field input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 1px rgba(0,242,255,0.2), 0 0 20px rgba(0,242,255,0.08);
        }
        .field input::placeholder { color: rgba(255,255,255,0.2); }
        .field-err {
            font-family: 'Share Tech Mono'; font-size: 0.58rem; letter-spacing: 1px;
            color: var(--error); margin-top: 5px; display: none;
        }
        .field.has-error input { border-color: var(--error); }
        .field.has-error .field-err { display: block; }

        .pw-wrap { position: relative; }
        .pw-wrap input { padding-right: 44px; }
        .pw-eye {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.3);
            font-size: 1rem; transition: color 0.3s; padding: 4px;
        }
        .pw-eye:hover { color: var(--cyan); }

        .pw-hint {
            font-family: 'Share Tech Mono'; font-size: 0.58rem; letter-spacing: 1px;
            color: rgba(255,255,255,0.3); margin-top: 5px;
        }

        .btn-primary {
            width: 100%; background: transparent;
            border: 1px solid var(--cyan); color: var(--cyan);
            font-family: 'Orbitron'; font-size: 0.65rem; letter-spacing: 4px;
            padding: 14px; cursor: pointer;
            clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%);
            position: relative; overflow: hidden;
            transition: color 0.4s;
        }
        .btn-primary::before {
            content: ''; position: absolute; inset: 0;
            background: var(--cyan); transform: scaleX(0); transform-origin: left;
            transition: transform 0.4s var(--expo); z-index: -1;
        }
        .btn-primary:hover { color: #000; }
        .btn-primary:hover::before { transform: scaleX(1); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

        .link-row {
            text-align: center; font-size: 0.82rem; color: rgba(255,255,255,0.35);
            letter-spacing: 1px; margin-top: 24px;
        }
        .link-row a { color: var(--cyan); text-decoration: none; font-weight: 600; transition: text-shadow 0.3s; }
        .link-row a:hover { text-shadow: 0 0 10px var(--cyan); }

        /* ── TOAST ── */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
            background: rgba(0,13,26,0.97); border: 1px solid var(--border-bright);
            padding: 14px 28px; font-family: 'Orbitron'; font-size: 0.58rem; letter-spacing: 3px;
            color: var(--cyan); z-index: 9999; pointer-events: none;
            transition: transform 0.5s var(--expo), opacity 0.5s;
            opacity: 0;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.error { border-color: var(--error); color: var(--error); }
        .toast.success { border-color: var(--success); color: var(--success); }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid rgba(0,242,255,0.2); border-top-color: var(--cyan);
            border-radius: 50%; animation: spin 0.7s linear infinite;
            vertical-align: middle; margin-right: 8px;
        }
    </style>
</head>
<body>

<div id="bg">
    <div class="grid-bg"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="scan-line"></div>
    <div class="radar-ring"></div>
</div>

<nav>
    <a href="{{ url_for('home') }}" class="nav-brand">⚓ ANCHORAGE 2026</a>
    <div class="nav-links-right">
        <a href="{{ url_for('events') }}">EVENTS</a>
        <a href="{{ url_for('register') }}" class="nav-cta">REGISTER</a>
    </div>
</nav>

<div class="login-wrap">
    <div class="login-card">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <span class="card-tag">◈ DEPT OF SHIP TECHNOLOGY ◈</span>
        <h1 class="card-title">NEW PASSWORD</h1>
        <p class="card-sub">Choose a new password for your account</p>

        <form id="resetForm" method="POST" action="{{ url_for('reset_password', token=token) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field" id="f-pw">
                <label>NEW PASSWORD</label>
                <div class="pw-wrap">
                    <input type="password" name="password" id="newPw" placeholder="••••••••" autocomplete="new-password">
                    <button class="pw-eye" type="button" onclick="togglePw('newPw', this)" aria-label="Toggle password">👁</button>
                </div>
                <div class="pw-hint">At least 8 characters</div>
                <div class="field-err" id="e-pw">Password must be at least 8 characters</div>
            </div>

            <div class="field" id="f-confirm">
                <label>CONFIRM PASSWORD</label>
                <div class="pw-wrap">
                    <input type="password" name="confirm_password" id="confirmPw" placeholder="••••••••" autocomplete="new-password">
                    <button class="pw-eye" type="button" onclick="togglePw('confirmPw', this)" aria-label="Toggle password">👁</button>
                </div>
                <div class="field-err" id="e-confirm">Passwords do not match</div>
            </div>

            <button class="btn-primary" id="resetBtn" type="submit">UPDATE PASSWORD</button>
        </form>

        <div class="link-row">
            <a href="{{ url_for('login') }}">← Back to sign in</a>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    function togglePw(id, btn) {
        const inp = document.getElementById(id);
        if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
        else { inp.type = 'password'; btn.textContent = '👁'; }
    }

    function showToast(msg, type = '') {
        const t = document.getElementById('toast');
        t.textContent = msg; t.className = 'toast show ' + type;
        setTimeout(() => t.className = 'toast', 3500);
    }

    function setErr(fieldId, show) {
        document.getElementById(fieldId).classList.toggle('has-error', show);
    }

    // Show flash messages from Flask
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            window.addEventListener('DOMContentLoaded', () => {
                {% for msg in messages %}
                    showToast('◈ {{ msg | upper }}', 'error');
                {% endfor %}
            });
        {% endif %}
    {% endwith %}

    document.getElementById('resetForm').addEventListener('submit', function (e) {
        const pw      = document.getElementById('newPw').value;
        const confirm = document.getElementById('confirmPw').value;
        let ok = true;

        const pwOk = pw.length >= 8;
        setErr('f-pw', !pwOk); if (!pwOk) ok = false;

        const matchOk = pw === confirm && confirm.length > 0;
        setErr('f-confirm', !matchOk); if (!matchOk) ok = false;

        if (!ok) { e.preventDefault(); return; }

        const btn = document.getElementById('resetBtn');
        btn.innerHTML = '<span class="spinner"></span>UPDATING…';
        btn.disabled = true;
    });
</script>
</body>
</html>
