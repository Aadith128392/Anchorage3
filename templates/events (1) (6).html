<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events | Anchorage 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ═══════════════════════════════════════════════════════════
   DESIGN TOKENS
   Desktop base: 16px root. Scale targets a 1080p+ monitor.
   Mobile override below bumps readable sizes up for fingers.
═══════════════════════════════════════════════════════════ */
:root{
  /* palette */
  --cyan:#00f2ff;
  --cyan-dim:rgba(0,242,255,0.07);
  --ocean:#00050a;
  --ocean-mid:#000d15;
  --ocean-card:#00111e;
  --border:rgba(0,242,255,0.15);
  --border-hi:rgba(0,242,255,0.4);
  --gold:#ffd166;
  --coral:#ff6b6b;
  --green:#06d6a0;
  --expo:cubic-bezier(0.19,1,0.22,1);

  /* layout */
  --nav-h:60px;
  --daybar-h:52px;
  --fbar-h:46px;

  /* ── TYPE SCALE ──────────────────────────────────────────
     Orbitron & Share Tech Mono render large — values here
     are intentionally small to feel refined, not cramped.

     label    rem    px @16   use
     -------  -----  -------  ---------------------------------
     --t-tag  .6rem  9.6px    type badges, mono meta, counters
     --t-sm   .68rem 10.9px   sub-dates, gf-count, dot labels
     --t-ui   .72rem 11.5px   nav links, filter btns, card btns
     --t-body .78rem 12.5px   card name, prize line, modal body
     --t-md   .88rem 14.1px   modal title min, section headers
     --t-day  clamp  —        day section title (responsive)
     --t-hero clamp  —        page H1 (responsive)
  ── */
  --t-tag:  .6rem;
  --t-sm:   .68rem;
  --t-ui:   .72rem;
  --t-body: .78rem;
  --t-md:   .88rem;
  --t-day:  clamp(1.3rem,3.5vw,2rem);
  --t-hero: clamp(2.4rem,8vw,5.2rem);

  /* letter-spacing */
  --lsp-tight:1px;
  --lsp-mid:  2px;
  --lsp-wide: 3.5px;
  --lsp-xw:   5px;
}

/* Mobile ≤599px — smaller, tighter, premium -------------------- */
@media(max-width:599px){
  :root{
    --t-tag:  .52rem;
    --t-sm:   .58rem;
    --t-ui:   .62rem;
    --t-body: .68rem;
    --t-md:   .78rem;
    --t-day:  clamp(.95rem,5.5vw,1.25rem);
    --t-hero: clamp(1.7rem,12vw,2.6rem);
    --nav-h:   52px;
    --fbar-h:  38px;
    --lsp-mid: 1.5px;
    --lsp-wide:2.5px;
    --lsp-xw:  3.5px;
  }
  nav{padding:0 12px;gap:6px}
  .nav-brand{font-size:.52rem;letter-spacing:2px;gap:5px}
  .nav-brand img{height:22px}
  .cart-btn{padding:5px 10px}
  .nav-user{padding:5px 10px}
  .global-filter-bar{padding:0 10px}
  .gf-btn{padding:0 12px}
  .gf-label{margin-right:8px;font-size:.46rem}
  .page-hero{padding:calc(var(--nav-h) + 26px) 14px 16px}
  .page-hero h1{letter-spacing:3px}
  .hero-tag{letter-spacing:3px;margin-bottom:7px}
  .page-hero p{margin-top:6px}
  .days-container{padding:0 12px 80px}
  .day-section{margin-top:30px}
  .day-divider{margin:36px 0 0}
  .day-hdr{gap:8px;margin-bottom:14px;padding-bottom:10px}
  .day-num-badge{padding:3px 8px}
  .day-title{letter-spacing:3px}
  .day-count{display:none}
  .carousel-wrap{padding:0 26px;margin-bottom:24px}
  .carousel-stage{height:350px}
  .c-slide{width:128px}
  .c-slide[data-pos="1"]{transform:translate(calc(-50% + 118px),-50%) translateZ(-58px) scale(.78) rotateY(-12deg)}
  .c-slide[data-pos="-1"]{transform:translate(calc(-50% - 118px),-50%) translateZ(-58px) scale(.78) rotateY(12deg)}
  .c-slide[data-pos="2"],.c-slide[data-pos="-2"],
  .c-slide[data-pos="3"],.c-slide[data-pos="-3"]{opacity:0;pointer-events:none}
  .c-arrow{width:28px;height:28px;font-size:.7rem}
  .slide-info{padding:6px 9px 4px}
  .slide-name{font-size:clamp(.62rem,3.8vw,.78rem);margin-bottom:3px}
  .slide-prize{font-size:.74rem;font-weight:700}
  .slide-prize-ico{font-size:.82rem}
  .slide-acts{padding:0 9px 8px;gap:4px}
  .slide-btn-det,.slide-btn-cart{padding:8px 7px;font-size:clamp(.54rem,3vw,.64rem);letter-spacing:1px}
  .carousel-foot{gap:8px;margin-top:10px}
  .events-grid{gap:7px}
  .type-filters{gap:3px;margin-bottom:10px}
  .type-btn{padding:4px 8px;font-size:var(--t-tag);letter-spacing:1px}
  .sub-lbl{margin-bottom:8px}
  .ph-icon{font-size:1.2rem}
  .ph-name{font-size:.36rem}
  .slide-ph-icon{font-size:1.5rem}
  .ev-body{padding:8px 8px 6px;gap:4px}
  .ev-name{font-size:clamp(.62rem,3.8vw,.78rem);letter-spacing:1px}
  .ev-prize{font-size:.6rem;font-weight:700}
  .ev-prize-ico{font-size:.7rem}
  .ev-free{font-size:var(--t-tag);padding:1px 5px}
  .ev-type-tag{font-size:.42rem;padding:1px 5px;top:4px;left:4px}
  .ev-footer{padding:7px 8px 9px;gap:4px}
  .ev-det-btn{padding:8px 6px;font-size:clamp(.54rem,3vw,.66rem);letter-spacing:1px}
  .ev-cart-btn{padding:8px 6px;font-size:clamp(.54rem,3vw,.66rem);letter-spacing:1px}
  .ev-open-tag{font-size:var(--t-tag)}
  #event-modal{padding:58px 14px 32px}
  .modal-poster-wrap{max-width:160px;margin-bottom:16px}
  .modal-poster-ph{font-size:2.8rem}
  .modal-title{letter-spacing:1.8px;margin-bottom:4px}
  .modal-subtitle{margin-bottom:14px}
  .modal-meta-strip{margin-bottom:16px}
  .modal-prize-banner{padding:11px 14px;gap:10px;margin-bottom:16px}
  .modal-actions{flex-direction:column;align-items:stretch}
  .modal-cart-btn{text-align:center;padding:14px 16px;font-size:.66rem}
  .coming-soon{padding:36px 14px;gap:9px}
  .cs-ico{font-size:1.5rem}
  .cs-ttl{letter-spacing:3px}
  .cart-fab{padding:8px 12px;font-size:var(--t-tag);bottom:12px;right:10px}
  .fab-count{width:15px;height:15px;font-size:.52rem}
  .toast{padding:7px 14px;font-size:var(--t-tag)}
}

html{scroll-behavior:smooth}
body{background:var(--ocean);color:#fff;font-family:'Rajdhani',sans-serif;overflow-x:hidden;min-height:100vh}

/* ── BACKGROUND ── */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:radial-gradient(ellipse 140% 60% at 50% -10%,rgba(0,70,100,.28) 0%,var(--ocean) 65%)}
.grid-bg{position:absolute;inset:0;
  background-image:linear-gradient(rgba(0,242,255,.025) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(0,242,255,.025) 1px,transparent 1px);
  background-size:50px 50px}
.radar{position:absolute;top:50%;left:50%;width:130vw;height:130vw;border-radius:50%;
  border:1px solid rgba(0,242,255,.04);transform:translate(-50%,-50%) scale(0);
  animation:rping 12s infinite linear}
@keyframes rping{to{transform:translate(-50%,-50%) scale(1.5);opacity:0}}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:999;
  background:rgba(0,5,10,.96);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;gap:8px;
  animation:navDown .6s var(--expo) both}
@keyframes navDown{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
.nav-brand{font-family:'Orbitron';font-size:clamp(.55rem,1.8vw,.7rem);letter-spacing:3px;
  color:var(--cyan);text-decoration:none;text-shadow:0 0 16px rgba(0,242,255,.4);
  flex-shrink:0;display:flex;align-items:center;gap:8px}
.nav-brand img{height:28px;width:auto;filter:drop-shadow(0 0 5px var(--cyan))}
.nav-center{display:none}
@media(min-width:700px){
  .nav-center{display:flex;gap:24px}
  .nav-center a{font-family:'Orbitron';font-size:var(--t-ui);letter-spacing:var(--lsp-mid);
    text-decoration:none;color:rgba(255,255,255,.38);transition:color .3s}
  .nav-center a:hover,.nav-center a.active{color:var(--cyan)}
}
.nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cart-btn{position:relative;font-family:'Orbitron';font-size:var(--t-ui);letter-spacing:var(--lsp-mid);
  color:var(--cyan);border:1px solid var(--border);padding:6px 14px;
  text-decoration:none;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);
  white-space:nowrap;transition:background .3s,border-color .3s}
.cart-btn:hover{background:rgba(0,242,255,.08);border-color:var(--cyan)}
.cart-badge{position:absolute;top:-6px;right:-6px;width:17px;height:17px;
  background:var(--cyan);color:#000;border-radius:50%;
  font-family:'Share Tech Mono';font-size:.6rem;font-weight:700;
  display:none;align-items:center;justify-content:center}
.cart-badge.show{display:flex;animation:pop .3s var(--expo)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.nav-user{font-family:'Orbitron';font-size:var(--t-ui);letter-spacing:var(--lsp-mid);
  color:var(--cyan);border:1px solid var(--cyan);padding:6px 14px;
  text-decoration:none;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);
  white-space:nowrap;transition:background .3s,color .3s}
.nav-user:hover{background:var(--cyan);color:#000}

/* ── GLOBAL FILTER BAR ── */
.global-filter-bar{position:sticky;top:var(--nav-h);z-index:700;
  background:rgba(0,5,10,.97);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);padding:0 20px;
  animation:barDown .5s .35s var(--expo) both}
@media(min-width:1024px){.global-filter-bar,.days-container{padding-left:40px;padding-right:40px}}
.global-filter-inner{max-width:1300px;margin:0 auto;
  display:flex;align-items:center;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;height:var(--fbar-h);
  -webkit-overflow-scrolling:touch}
@media(min-width:900px){.global-filter-inner{justify-content:center}}
.global-filter-inner::-webkit-scrollbar{display:none}
.gf-label{display:none}
.gf-btn{font-family:'Orbitron';font-size:var(--t-ui);letter-spacing:var(--lsp-mid);
  padding:0 18px;height:100%;
  border:none;border-right:1px solid var(--border);
  background:none;color:rgba(255,255,255,.3);
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  position:relative;transition:color .3s,background .3s,transform .2s var(--expo);
  display:flex;align-items:center;gap:6px}
.gf-btn:first-of-type{border-left:1px solid var(--border)}
.gf-btn::after{content:'';position:absolute;bottom:0;left:50%;
  width:0;height:2px;background:var(--cyan);
  transform:translateX(-50%);transition:width .4s var(--expo)}
.gf-btn:hover{color:rgba(0,242,255,.7);background:rgba(0,242,255,.03);transform:translateY(-1px)}
.gf-btn.active{color:var(--cyan);background:rgba(0,242,255,.05)}
.gf-btn.active::after{width:80%}
.gf-dot{width:4px;height:4px;border-radius:50%;background:var(--cyan);
  opacity:0;box-shadow:0 0 5px var(--cyan);transition:opacity .3s;flex-shrink:0}
.gf-btn.active .gf-dot{opacity:1}
.gf-count{font-family:'Share Tech Mono';font-size:var(--t-tag);letter-spacing:.5px;
  color:rgba(0,242,255,.45)}

/* ── PAGE HERO ── */
.page-hero{padding:calc(var(--nav-h) + 44px) 20px 28px;text-align:center}
.hero-tag{font-family:'Share Tech Mono';font-size:var(--t-sm);letter-spacing:var(--lsp-xw);
  color:var(--cyan);opacity:.85;margin-bottom:12px;display:block;
  text-shadow:0 0 12px rgba(0,242,255,.5);
  animation:tagDrop .7s var(--expo) both}
@keyframes tagDrop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.page-hero h1{font-family:'Orbitron';font-size:var(--t-hero);font-weight:900;letter-spacing:6px;
  color:var(--cyan);
  text-shadow:0 0 28px rgba(0,242,255,.8),0 0 56px rgba(0,242,255,.4),0 0 90px rgba(0,242,255,.18);
  animation:h1Rise .9s .18s var(--expo) both}
@keyframes h1Rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.page-hero p{margin-top:10px;font-size:var(--t-body);color:rgba(255,255,255,.48);letter-spacing:.8px;
  max-width:480px;margin-inline:auto;line-height:1.65;
  animation:subFade .8s .5s ease both}
@keyframes subFade{from{opacity:0}to{opacity:1}}

/* filter notice */
.filter-notice{text-align:center;padding:10px 0 0;
  font-family:'Share Tech Mono';font-size:var(--t-sm);letter-spacing:var(--lsp-wide);
  color:rgba(0,242,255,.45);display:none}
.filter-notice.show{display:block}
.filter-notice span{color:var(--cyan)}

/* ── DAYS CONTAINER ── */
.days-container{max-width:1300px;margin:0 auto;padding:0 20px 100px}

.day-section{margin-top:44px;padding-top:8px}
.day-section.gf-hidden{display:none}

.day-divider{display:flex;align-items:center;gap:12px;margin:56px 0 0}
.day-divider.gf-hidden{display:none}
.ddl{flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent)}
.ddr{flex:1;height:1px;background:linear-gradient(to left,var(--border),transparent)}
.ddd{width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}

/* ── DAY SECTION HEADER ── */
.day-hdr{display:flex;align-items:center;gap:12px;
  margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.day-num-badge{font-family:'Orbitron';font-size:var(--t-tag);letter-spacing:var(--lsp-wide);
  border:1px solid var(--border-hi);color:var(--cyan);padding:5px 12px;
  white-space:nowrap;background:rgba(0,242,255,.05)}
.day-title-wrap{flex:1;min-width:0}
.day-title{font-family:'Orbitron';font-size:var(--t-day);font-weight:900;letter-spacing:5px;
  color:var(--cyan);text-shadow:0 0 18px rgba(0,242,255,.7),0 0 36px rgba(0,242,255,.3)}
.day-date{font-family:'Share Tech Mono';font-size:var(--t-tag);letter-spacing:var(--lsp-mid);
  color:rgba(0,242,255,.5);margin-top:2px}
.day-count{font-family:'Share Tech Mono';font-size:var(--t-tag);letter-spacing:var(--lsp-mid);
  color:rgba(255,255,255,.22)}

/* ══════════════════════════════════════════════════════════
   CAROUSEL
   Stage has overflow:visible — the .carousel-wrap clips it
   with padding + overflow:hidden so arrows stay visible.
══════════════════════════════════════════════════════════ */
.carousel-wrap{position:relative;margin-bottom:40px;padding:0 44px;overflow:hidden}
@media(max-width:599px){.carousel-wrap{padding:0 32px}}

.carousel-lbl{font-family:'Share Tech Mono';font-size:var(--t-tag);letter-spacing:var(--lsp-xw);
  color:var(--cyan);opacity:.45;margin-bottom:14px;display:block}

.carousel-stage{
  position:relative;
  height:520px;         /* desktop: tall enough for poster + info + 2 btns */
  perspective:1200px;
  display:flex;align-items:center;justify-content:center;
  overflow:visible;
}
@media(max-width:599px){.carousel-stage{height:430px}}
@media(min-width:600px) and (max-width:1023px){.carousel-stage{height:480px}}

/* ── slide card ── */
.c-slide{
  position:absolute;top:50%;left:50%;
  width:190px;
  transform-origin:center;
  transform:translate(-50%,-50%);
  transition:all .6s cubic-bezier(.23,1,.32,1);
  cursor:pointer;
  contain:layout style;
}
@media(max-width:599px){.c-slide{width:148px}}
@media(min-width:600px) and (max-width:1023px){.c-slide{width:170px}}

.slide-inner{width:100%;position:relative;border:1px solid var(--border);
  background:var(--ocean-mid);overflow:hidden;display:flex;flex-direction:column}

/* poster area */
.slide-poster-wrap{width:100%;aspect-ratio:9/16;position:relative;overflow:hidden;flex-shrink:0}
.slide-poster{width:100%;height:100%;object-fit:cover;display:block}
.slide-ph{width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(160deg,#001a2c 0%,#000d15 60%,#001520 100%);position:relative}
.slide-ph::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,transparent,transparent 18px,rgba(0,242,255,.01) 18px,rgba(0,242,255,.01) 19px)}
.slide-ph-icon{font-size:1.9rem;position:relative;z-index:1;
  filter:drop-shadow(0 0 12px var(--cyan));animation:floatY 3s ease-in-out infinite}
.slide-ph-name{font-family:'Orbitron';font-size:var(--t-tag);letter-spacing:1px;
  color:var(--cyan);text-align:center;padding:0 8px;position:relative;z-index:1;line-height:1.3}
.slide-type-tag{position:absolute;top:7px;left:7px;z-index:2;
  font-family:'Orbitron';font-size:var(--t-tag);letter-spacing:1.5px;
  padding:2px 6px;background:rgba(0,5,10,.9);border:1px solid var(--border);color:var(--cyan)}

/* info block — CENTRE SLIDE ONLY: name + prize */
.slide-info{width:100%;padding:10px 12px 6px;
  background:var(--ocean-mid);border-top:1px solid var(--border);display:none}
.c-slide[data-pos="0"] .slide-info{display:block}

.slide-name{font-family:'Orbitron';font-size:clamp(.72rem,2vw,.9rem);letter-spacing:1.5px;
  color:#fff;margin-bottom:5px;line-height:1.3;font-weight:700}
.slide-prize{font-family:'Orbitron';font-size:clamp(.78rem,2.1vw,.96rem);letter-spacing:.8px;font-weight:700;
  color:var(--gold);display:flex;align-items:center;gap:6px;
  text-shadow:0 0 16px rgba(255,209,102,.45);margin-top:1px}
.slide-prize-ico{font-size:1rem}

/* action row — CENTRE SLIDE ONLY: DETAILS + ADD TO CART */
.slide-acts{display:none;flex-direction:column;gap:5px;
  padding:0 12px 10px;background:var(--ocean-mid);width:100%}
.c-slide[data-pos="0"] .slide-acts{display:flex}
.c-slide:not([data-pos="0"]) .slide-info,
.c-slide:not([data-pos="0"]) .slide-acts{display:none !important}

.slide-btn-det{font-family:'Orbitron';font-size:clamp(.58rem,1.5vw,.72rem);letter-spacing:1.8px;
  padding:10px 10px;border:1px solid var(--cyan);background:rgba(0,5,10,.85);
  color:var(--cyan);cursor:pointer;width:100%;text-align:center;
  clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);transition:all .3s}
.slide-btn-det:hover{background:var(--cyan);color:var(--ocean)}

.slide-btn-cart{font-family:'Orbitron';font-size:clamp(.58rem,1.5vw,.72rem);letter-spacing:1.8px;
  padding:9px 10px;border:1px solid var(--green);background:rgba(0,5,10,.85);
  color:var(--green);cursor:pointer;width:100%;text-align:center;
  clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);transition:all .3s}
.slide-btn-cart:hover,.slide-btn-cart.in-cart{background:rgba(6,214,160,.12);color:var(--green)}
.slide-open-lbl{font-family:'Share Tech Mono';font-size:var(--t-tag);letter-spacing:1.5px;
  color:rgba(255,255,255,.3);text-align:center;padding:5px 0}

/* 3-D fan positions */
.c-slide[data-pos="0"]{
  transform:translate(-50%,-50%) translateZ(0) scale(1);
  z-index:10;filter:brightness(1);
  box-shadow:0 28px 64px rgba(0,0,0,.6),0 0 36px rgba(0,242,255,.1);
  animation:slideIn .55s var(--expo) both}
@keyframes slideIn{from{opacity:0;transform:translate(-50%,-50%) scale(.82) rotateY(12deg)}
  to{opacity:1;transform:translate(-50%,-50%) translateZ(0) scale(1) rotateY(0)}}
.c-slide[data-pos="1"]{transform:translate(calc(-50% + 200px),-50%) translateZ(-90px) scale(.82) rotateY(-15deg);z-index:8;filter:brightness(.58)}
.c-slide[data-pos="-1"]{transform:translate(calc(-50% - 200px),-50%) translateZ(-90px) scale(.82) rotateY(15deg);z-index:8;filter:brightness(.58)}
.c-slide[data-pos="2"]{transform:translate(calc(-50% + 348px),-50%) translateZ(-200px) scale(.65) rotateY(-26deg);z-index:6;filter:brightness(.32)}
.c-slide[data-pos="-2"]{transform:translate(calc(-50% - 348px),-50%) translateZ(-200px) scale(.65) rotateY(26deg);z-index:6;filter:brightness(.32)}
.c-slide[data-pos="3"],.c-slide[data-pos="-3"]{transform:translate(-50%,-50%) translateZ(-330px) scale(.44);z-index:1;filter:brightness(.1);opacity:.2}
.c-slide[data-pos="far"]{transform:translate(-50%,-50%) translateZ(-480px) scale(.26);z-index:0;opacity:0;pointer-events:none}

@media(max-width:480px){
  .c-slide[data-pos="1"]{transform:translate(calc(-50% + 148px),-50%) translateZ(-70px) scale(.8) rotateY(-13deg)}
  .c-slide[data-pos="-1"]{transform:translate(calc(-50% - 148px),-50%) translateZ(-70px) scale(.8) rotateY(13deg)}
  .c-slide[data-pos="2"],.c-slide[data-pos="-2"],
  .c-slide[data-pos="3"],.c-slide[data-pos="-3"]{opacity:0;pointer-events:none}
}

/* arrows — inside padded .carousel-wrap, so always visible */
.c-arrow{position:absolute;top:50%;
  transform:translateY(calc(-50% - 18px)); /* offset upward toward poster centre */
  width:36px;height:36px;
  border:1px solid var(--border);background:rgba(0,5,10,.92);
  color:var(--cyan);font-size:.85rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s var(--expo);backdrop-filter:blur(10px);
  clip-path:polygon(14% 0,100% 0,86% 100%,0 100%);z-index:30}
.c-arrow:hover{background:rgba(0,242,255,.14);border-color:var(--cyan);
  transform:translateY(calc(-50% - 18px)) scale(1.08)}
.c-arrow.prev{left:2px}
.c-arrow.next{right:2px}

/* footer: dots + counter */
.carousel-foot{display:flex;align-items:center;justify-content:center;
  gap:12px;margin-top:14px;position:relative;z-index:20}
.c-dots{display:flex;gap:5px}
.c-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.16);cursor:pointer;transition:all .3s}
.c-dot.active{background:var(--cyan);box-shadow:0 0 5px var(--cyan);width:15px;border-radius:3px}
.c-counter{font-family:'Share Tech Mono';font-size:var(--t-tag);letter-spacing:2px;color:rgba(255,255,255,.25)}
.c-counter span{color:var(--cyan)}
.c-empty{height:70px;display:flex;align-items:center;justify-content:center;
  font-family:'Share Tech Mono';font-size:var(--t-sm);letter-spacing:3px;color:rgba(255,255,255,.15)}

/* ══════════════════════════════════════════════════════════
   EVENT CARDS GRID
   Card shows: poster | name | prize | [DETAILS] [+ CART]
   No description, no meta rows.
══════════════════════════════════════════════════════════ */
.events-sub{margin-top:8px}
.sub-lbl{font-family:'Share Tech Mono';font-size:var(--t-tag);letter-spacing:var(--lsp-xw);
  color:rgba(255,255,255,.22);margin-bottom:14px;display:block}

.type-filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px}
.type-btn{font-family:'Orbitron';font-size:var(--t-ui);letter-spacing:var(--lsp-mid);
  padding:6px 12px;border:1px solid var(--border);background:transparent;
  color:rgba(255,255,255,.38);cursor:pointer;transition:all .3s;white-space:nowrap;
  position:relative;
  animation:btnPop .4s var(--expo) both}
@keyframes btnPop{from{opacity:0;transform:scale(.88) translateY(7px)}to{opacity:1;transform:none}}
.type-btn:nth-child(1){animation-delay:.04s}
.type-btn:nth-child(2){animation-delay:.1s}
.type-btn:nth-child(3){animation-delay:.16s}
.type-btn:nth-child(4){animation-delay:.22s}
.type-btn:nth-child(5){animation-delay:.28s}
.type-btn:hover,.type-btn.active{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-dim)}
.type-btn.active::after{content:'';position:absolute;bottom:-1px;left:50%;
  width:55%;height:2px;background:var(--cyan);transform:translateX(-50%);border-radius:1px}

/* grid layout */
.events-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;width:100%}
@media(min-width:600px){.events-grid{gap:13px}}
@media(min-width:768px){.events-grid{grid-template-columns:repeat(3,1fr);gap:15px}}
@media(min-width:1100px){.events-grid{grid-template-columns:repeat(5,1fr);gap:16px}}

/* card shell */
.event-card{position:relative;background:var(--ocean-card);border:1px solid var(--border);
  overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
  clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,0 100%);
  transition:border-color .3s,box-shadow .35s,transform .35s var(--expo);
  animation:cardUp .5s var(--expo) both;animation-play-state:paused}
.event-card.anim-ready{animation-play-state:running}
@keyframes cardUp{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}
.event-card:hover{border-color:var(--border-hi);transform:translateY(-4px);
  box-shadow:0 0 0 1px rgba(0,242,255,.07),0 14px 44px rgba(0,0,0,.5),0 0 28px rgba(0,242,255,.07)}

/* corner cut accent */
.event-card::before{content:'';position:absolute;top:0;right:0;z-index:3;
  width:9px;height:9px;background:var(--cyan);
  clip-path:polygon(0 0,100% 0,100% 100%);opacity:.65;transition:opacity .3s}
.event-card:hover::before{opacity:1}

/* scan line — only on hover */
.card-scan{position:absolute;top:-100%;left:0;width:100%;height:30%;pointer-events:none;z-index:4;
  background:linear-gradient(to bottom,transparent,rgba(0,242,255,.025),transparent);
  animation:none}
.event-card:hover .card-scan{animation:scanMove .8s linear forwards}
@keyframes scanMove{to{top:200%}}

/* shimmer on hover */
.event-card::after{content:'';position:absolute;top:0;left:0;width:38%;height:100%;
  background:linear-gradient(108deg,transparent 28%,rgba(0,242,255,.05) 50%,transparent 72%);
  transform:translateX(-100%);pointer-events:none;z-index:5}
.event-card:hover::after{animation:shimmer .6s ease forwards}
@keyframes shimmer{to{transform:translateX(280%)}}

/* poster */
.ev-poster{width:100%;aspect-ratio:9/16;overflow:hidden;position:relative;flex-shrink:0}
.ev-poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .65s var(--expo)}
.event-card:hover .ev-poster img{transform:scale(1.055)}
.poster-ph{width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:7px;position:relative;overflow:hidden}
.type-competition .poster-ph{background:linear-gradient(160deg,#001a2c 0%,#000d15 45%,#001a1a 100%)}
.type-workshop   .poster-ph{background:linear-gradient(160deg,#0d001a 0%,#000d15 45%,#001530 100%)}
.type-exhibition .poster-ph{background:linear-gradient(160deg,#001a10 0%,#000d15 45%,#001a28 100%)}
.type-session    .poster-ph{background:linear-gradient(160deg,#1a1000 0%,#0d0800 45%,#001015 100%)}
.type-media      .poster-ph{background:linear-gradient(160deg,#1a0010 0%,#0d0015 45%,#0d0030 100%)}
.type-creative   .poster-ph{background:linear-gradient(160deg,#001a18 0%,#00100d 45%,#001a10 100%)}
.poster-ph::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 26px,rgba(0,242,255,.035) 26px,rgba(0,242,255,.035) 27px),
             repeating-linear-gradient(90deg,transparent,transparent 26px,rgba(0,242,255,.035) 26px,rgba(0,242,255,.035) 27px)}
.ph-icon{font-size:clamp(1.4rem,3.5vw,2rem);position:relative;z-index:1;
  filter:drop-shadow(0 0 10px currentColor);animation:floatY 3s ease-in-out infinite}
.ph-name{font-family:'Orbitron';font-size:clamp(.4rem,1.1vw,.52rem);letter-spacing:1.2px;
  color:rgba(255,255,255,.65);text-align:center;padding:0 7px;
  position:relative;z-index:1;line-height:1.4;max-width:90%}
.ev-type-tag{position:absolute;top:6px;left:6px;z-index:2;
  font-family:'Orbitron';font-size:var(--t-tag);letter-spacing:1.2px;
  padding:2px 6px;background:rgba(0,5,10,.9);border:1px solid var(--border);color:var(--cyan)}
.poster-grad{position:absolute;bottom:0;left:0;right:0;height:38%;
  background:linear-gradient(to top,rgba(0,13,21,.88) 0%,transparent 100%);
  z-index:1;pointer-events:none}

/* ── card body: NAME + PRIZE only ── */
.ev-body{padding:10px 10px 8px;display:flex;flex-direction:column;gap:4px;flex:1}
.ev-name{font-family:'Orbitron';font-size:clamp(.68rem,1.9vw,.87rem);letter-spacing:1.4px;
  color:#fff;line-height:1.3;font-weight:700;
  text-shadow:0 0 18px rgba(255,255,255,.12)}
.ev-subname{font-family:'Share Tech Mono';font-size:clamp(.64rem,1.7vw,.78rem);letter-spacing:1.5px;
  color:var(--cyan);opacity:1;line-height:1.2;text-transform:uppercase;
  text-shadow:0 0 8px rgba(0,242,255,.45);font-weight:700}
.ev-prize{font-family:'Orbitron';font-size:clamp(.62rem,1.7vw,.76rem);letter-spacing:.6px;font-weight:700;
  color:var(--gold);display:flex;align-items:center;gap:5px;
  text-shadow:0 0 12px rgba(255,209,102,.4)}
.ev-prize-ico{font-size:.8rem}
/* free / open badge */
.ev-free{font-family:'Share Tech Mono';font-size:var(--t-tag);letter-spacing:1px;
  color:var(--green);border:1px solid rgba(6,214,160,.3);
  background:rgba(6,214,160,.06);padding:2px 6px;display:inline-block;width:fit-content}

/* ── card footer: DETAILS + ADD TO CART ── */
.ev-footer{display:flex;gap:5px;align-items:center;padding:9px 10px 11px;
  border-top:1px solid rgba(0,242,255,.06)}
.ev-det-btn{font-family:'Orbitron';font-size:clamp(.55rem,1.3vw,.68rem);letter-spacing:1.7px;
  padding:8px 9px;border:1px solid var(--border);background:transparent;
  color:rgba(255,255,255,.55);cursor:pointer;transition:all .28s;flex:1;text-align:center}
.ev-det-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.ev-cart-btn{font-family:'Orbitron';font-size:clamp(.55rem,1.3vw,.68rem);letter-spacing:1.7px;
  padding:8px 9px;border:1px solid var(--cyan);background:rgba(0,242,255,.06);
  color:var(--cyan);cursor:pointer;transition:all .28s;flex:1.2;text-align:center;
  clip-path:polygon(5% 0,100% 0,95% 100%,0 100%)}
.ev-cart-btn:hover{background:var(--cyan);color:var(--ocean)}
.ev-cart-btn.in-cart{border-color:var(--green);background:rgba(6,214,160,.1);color:var(--green)}
.ev-cart-btn.registered,.slide-btn-cart.registered,.modal-cart-btn.registered{
  border-color:var(--green)!important;background:rgba(6,214,160,.08)!important;
  color:var(--green)!important;cursor:default!important;opacity:.8}
.ev-cart-btn.pending,.slide-btn-cart.pending,.modal-cart-btn.pending{
  border-color:var(--gold)!important;background:rgba(255,209,102,.08)!important;
  color:var(--gold)!important;cursor:default!important;opacity:.85}
.ev-open-tag{font-family:'Share Tech Mono';font-size:var(--t-tag);letter-spacing:1px;
  color:rgba(255,255,255,.22);flex:1;text-align:center}
.empty-state{font-family:'Share Tech Mono';font-size:var(--t-sm);letter-spacing:3px;
  color:rgba(255,255,255,.15);padding:36px;text-align:center;
  border:1px dashed rgba(255,255,255,.07);grid-column:1/-1}

/* ── SOLD OUT ── */
/* card-level overlay tint */
.event-card.sold-out{opacity:.75}
.event-card.sold-out .ev-poster::after{
  content:'';position:absolute;inset:0;z-index:3;
  background:repeating-linear-gradient(
    -45deg,rgba(255,50,80,.06),rgba(255,50,80,.06) 8px,
    transparent 8px,transparent 16px)}
/* sold out badge in footer */
.ev-soldout-btn{
  font-family:'Orbitron';font-size:clamp(.54rem,1.3vw,.68rem);letter-spacing:1.8px;
  padding:9px 10px;border:1px solid rgba(255,68,102,.5);
  background:rgba(255,68,102,.08);color:var(--coral);
  flex:1.2;text-align:center;cursor:default;
  clip-path:polygon(5% 0,100% 0,95% 100%,0 100%)}
/* poster sold-out ribbon */
.soldout-ribbon{
  position:absolute;top:0;left:0;right:0;z-index:4;
  background:rgba(255,68,102,.88);
  font-family:'Orbitron';font-size:var(--t-tag);letter-spacing:3px;
  color:#fff;text-align:center;padding:5px 0;
  clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%)}
/* poster pending ribbon */
.pending-ribbon{
  position:absolute;top:0;left:0;right:0;z-index:4;
  background:rgba(255,209,102,.9);
  font-family:'Orbitron';font-size:var(--t-tag);letter-spacing:3px;
  color:#000;text-align:center;padding:5px 0;
  clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%)}
/* carousel sold-out btn */
.slide-btn-sold{
  font-family:'Orbitron';font-size:clamp(.54rem,1.5vw,.68rem);letter-spacing:1.8px;
  padding:9px 10px;border:1px solid rgba(255,68,102,.5);background:rgba(255,68,102,.08);
  color:var(--coral);cursor:default;width:100%;text-align:center;
  clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}
/* modal sold-out block */
.modal-soldout-banner{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;margin-bottom:0;
  border:1px solid rgba(255,68,102,.4);border-left:3px solid var(--coral);
  background:rgba(255,68,102,.06)}
.modal-soldout-icon{font-size:1.3rem;flex-shrink:0}
.modal-soldout-lbl{font-family:'Share Tech Mono';font-size:.58rem;letter-spacing:2px;
  color:var(--coral);opacity:.7;margin-bottom:3px}
.modal-soldout-val{font-family:'Orbitron';font-size:.82rem;color:var(--coral);
  letter-spacing:1.5px;font-weight:700}
/* modal pending block */
.modal-pending-banner{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;margin-bottom:0;
  border:1px solid rgba(255,209,102,.4);border-left:3px solid var(--gold);
  background:rgba(255,209,102,.06)}
.modal-pending-icon{font-size:1.3rem;flex-shrink:0}
.modal-pending-lbl{font-family:'Share Tech Mono';font-size:.58rem;letter-spacing:2px;
  color:var(--gold);opacity:.7;margin-bottom:3px}
.modal-pending-val{font-family:'Orbitron';font-size:.82rem;color:var(--gold);
  letter-spacing:1.5px;font-weight:700}

/* ══════════════════════════════════════════════════════════
   EVENT MODAL  — full detail view
══════════════════════════════════════════════════════════ */
#event-modal{position:fixed;inset:0;z-index:9999;
  background:rgba(0,5,10,.97);backdrop-filter:blur(24px);
  overflow-y:auto;padding:72px 20px 56px;opacity:0;pointer-events:none;transition:opacity .3s}
#event-modal.open{opacity:1;pointer-events:all}
#event-modal.open .modal-inner{animation:mRise .42s var(--expo) both}
@keyframes mRise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

.modal-close{position:fixed;top:14px;right:14px;
  font-family:'Orbitron';font-size:.65rem;letter-spacing:2.5px;
  background:rgba(0,5,10,.92);border:1px solid rgba(255,255,255,.18);
  color:rgba(255,255,255,.45);padding:9px 18px;cursor:pointer;transition:all .3s;z-index:2}
.modal-close:hover{border-color:var(--coral);color:var(--coral)}

/* ── Two-column layout on desktop: poster left, info right ── */
.modal-inner{
  max-width:860px;margin:0 auto;
  display:grid;
  grid-template-columns:300px 1fr;
  gap:40px;align-items:start;
}
@media(max-width:660px){
  .modal-inner{grid-template-columns:1fr;gap:20px}
}

/* poster */
.modal-poster-wrap{
  width:100%;aspect-ratio:9/16;
  overflow:hidden;border:1px solid var(--border-hi);
  position:sticky;top:16px;
}
@media(max-width:660px){
  .modal-poster-wrap{max-width:200px;margin:0 auto;position:static}
}
.modal-poster{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.modal-poster-ph{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:4.5rem;background:linear-gradient(135deg,#001520,#000d15)}

/* right-side info panel */
.modal-info{display:flex;flex-direction:column;gap:0}

.modal-type-tag{
  font-family:'Share Tech Mono';font-size:.64rem;letter-spacing:var(--lsp-xw);
  color:var(--cyan);opacity:.70;display:block;margin-bottom:12px}

.modal-title{
  font-family:'Orbitron';
  font-size:clamp(1.25rem,3.8vw,2rem);
  font-weight:900;letter-spacing:3.5px;
  margin-bottom:6px;line-height:1.15;color:#fff;
  text-shadow:0 0 24px rgba(0,242,255,.35)}

.modal-subtitle{
  font-family:'Share Tech Mono';
  font-size:clamp(.84rem,2.1vw,1.05rem);
  letter-spacing:3px;text-transform:uppercase;
  margin-bottom:26px;color:var(--cyan);opacity:1;
  text-shadow:0 0 12px rgba(0,242,255,.55);font-weight:700;
  border-left:3px solid var(--cyan);padding-left:10px}

/* meta grid */
.modal-meta-strip{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:0;
  border:1px solid var(--border);
  margin-bottom:26px}
.modal-meta-item{
  display:flex;flex-direction:column;gap:7px;
  padding:18px 20px;
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border)}
.modal-meta-item:nth-child(even){border-right:none}
.modal-meta-item:nth-last-child(-n+2){border-bottom:none}
.modal-meta-lbl{
  font-family:'Share Tech Mono';font-size:.62rem;letter-spacing:var(--lsp-mid);
  color:rgba(0,242,255,.55);text-transform:uppercase}
.modal-meta-val{
  font-size:1.08rem;font-weight:700;color:#fff;
  font-family:'Rajdhani';letter-spacing:.6px}

/* prize banner */
.modal-prize-banner{
  background:rgba(255,209,102,.04);
  border:1px solid rgba(255,209,102,.25);border-left:3px solid var(--gold);
  padding:18px 22px;margin-bottom:26px;
  display:flex;align-items:center;gap:16px;
  animation:pShimmer 2.5s ease infinite}
@keyframes pShimmer{0%,100%{background:rgba(255,209,102,.04)}50%{background:rgba(255,209,102,.09)}}
.mp-icon{font-size:1.6rem;flex-shrink:0}
.mp-lbl{font-family:'Share Tech Mono';font-size:.60rem;letter-spacing:var(--lsp-mid);
  color:var(--gold);opacity:.65;margin-bottom:4px}
.mp-val{font-family:'Orbitron';font-size:1.2rem;color:var(--gold);letter-spacing:2.5px;font-weight:700}

/* sponsors strip — sits below the meta/prize block, above the about text */
.sponsor-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.sponsor-chip{
  display:inline-flex;align-items:center;justify-content:center;
  height:104px;min-width:104px;flex-shrink:0;box-sizing:border-box;
  padding:14px;border-radius:16px;overflow:hidden;
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  transition:all .35s var(--expo)}
.sponsor-chip:hover{
  border-color:var(--border-hi);background:rgba(0,242,255,.05);
  transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,242,255,.14)}
.sponsor-chip img{
  /* sizes itself off the file's own dimensions: 100x100 logos render square,
     200x100 logos render twice as wide — the chip grows to match either */
  max-height:70px;max-width:200px;width:auto;height:auto;object-fit:contain;display:block}
.sponsor-fallback{
  font-family:'Orbitron';font-size:.76rem;letter-spacing:1px;font-weight:600;
  color:rgba(255,255,255,.42);text-transform:uppercase;
  white-space:normal;text-align:center;line-height:1.3;
  transition:color .35s}
.sponsor-chip:hover .sponsor-fallback{color:var(--cyan);text-shadow:0 0 10px rgba(0,242,255,.5)}

/* coordinators strip — stacked list, one per row */
.modal-coordinators{display:flex;flex-direction:column;gap:10px}
.coord-chip{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;
  background:rgba(0,242,255,.04);
  border:1px solid var(--border);
  border-left:3px solid var(--cyan);
  transition:all .3s var(--expo);
  width:100%;box-sizing:border-box}
.coord-chip:hover{
  background:rgba(0,242,255,.08);
  border-color:var(--border-hi);
  border-left-color:var(--cyan);
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,242,255,.1)}
.coord-avatar{
  width:34px;height:34px;border-radius:50%;
  background:rgba(0,242,255,.1);
  border:1px solid rgba(0,242,255,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:.9rem;flex-shrink:0}
.coord-info{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;min-width:0;flex:1}
.coord-name{
  font-family:'Orbitron';font-size:.66rem;letter-spacing:1.5px;
  color:rgba(255,255,255,.55);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:0 1 auto;min-width:0}
.coord-role{
  font-family:'Share Tech Mono';font-size:.58rem;letter-spacing:1.5px;
  color:rgba(0,242,255,.5)}
.coord-phone{
  font-family:'Share Tech Mono';font-size:.7rem;letter-spacing:.2px;
  color:var(--ocean);font-weight:700;text-decoration:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;
  display:inline-flex;align-items:center;gap:6px;
  min-width:0;max-width:100%;flex:0 1 auto;
  background:var(--gold);
  padding:6px 12px;
  border-radius:5px;
  box-shadow:0 2px 10px rgba(255,209,102,.22);
  transition:all .25s var(--expo);
  -webkit-tap-highlight-color:rgba(255,209,102,.3)}
.coord-phone .cp-ico{font-size:.78rem;flex-shrink:0}
.coord-phone:hover{background:#fff;box-shadow:0 4px 16px rgba(255,209,102,.5);transform:translateY(-1px)}

──────────────────────────────────────────────────────────────── */
const EARLY_BIRD_DEADLINE = new Date('2026-09-10T23:59:59+05:30');
const EARLY_BIRD_EXCLUDE_IDS = new Set(['campus-ambassador']); // The Voyage Corps
function isEarlyBirdActive(){ return new Date() <= EARLY_BIRD_DEADLINE; }
function eventHasEarlyBird(ev){
  return ev.fee==='paid' && !EARLY_BIRD_EXCLUDE_IDS.has(ev.id) &&
         ev.earlyFee!=null && Number(ev.earlyFee)!==Number(ev.feeAmt) && isEarlyBirdActive();
}
/* Returns the inline HTML for a fee figure, applying the early-bird
   old/new price treatment when eligible. Used by both the modal's
   FEE meta row and the modal action-row fee badge. */
function feeValueHTML(ev){
  if(ev.fee==='free') return 'FREE';
  const unit=ev.feeUnit||'REGISTRATION';
  if(eventHasEarlyBird(ev)){
    return `<span class="fee-eb"><span class="fee-old">₹${ev.feeAmt}</span>`
         + `<span class="fee-new">₹${ev.earlyFee}</span><span class="fee-new-tag">EARLY BIRD</span></span> / ${unit}`;

  return `₹${ev.feeAmt} / ${unit}`;
}

/* ── CART ── */
const getCart   = ()=>{ try{ return JSON.parse(localStorage.getItem('anch_cart')||'[]') }catch{ return [] } };
const saveCart  = c => localStorage.setItem('anch_cart',JSON.stringify(c));
const isInCart  = id => getCart().some(i=>i.id===id);
const isReg     = id => { const e=EVENTS.find(ev=>ev.id===id); return e ? REGISTERED_IDS.has(e.dbId) : false; };
const isPending = id => { const e=EVENTS.find(ev=>ev.id===id); return e ? PENDING_IDS.has(e.dbId) : false; };
const isSoldOut = id => { const e=EVENTS.find(ev=>ev.id===id); return e ? SOLD_OUT_IDS.has(e.dbId) : false; };

function toggleCart(id,e){
  if(e) e.stopPropagation();
  const ev=EVENTS.find(ev=>ev.id===id); if(!ev) return;
  if(isSoldOut(id)){ showToast('◈ REGISTRATIONS CLOSED — SOLD OUT','removed'); return; }
  if(isReg(id)){ showToast('◈ ALREADY REGISTERED','removed'); return; }
  if(isPending(id)){ showToast('◈ PAYMENT PENDING VERIFICATION','removed'); return; }
  if(isInCart(id)){
    saveCart(getCart().filter(i=>i.id!==id));
    refreshAll(); updateModalBtn(id); updateCartUI();
    showToast('◈ REMOVED FROM CART','removed');
    fetch('/api/cart/remove/'+ev.dbId,{method:'POST'}).catch(()=>{});
  } else {
    const c=getCart(); c.push({id:ev.id,dbId:ev.dbId,name:ev.name}); saveCart(c);
    refreshAll(); updateModalBtn(id); updateCartUI();
    showToast('◈ ADDED TO CART','added');
    fetch('/add-to-cart/'+ev.dbId,{method:'POST'}).catch(()=>{});
  }
}

function updateCartUI(){
  const n=getCart().length;
  const badge=document.getElementById('cartBadge');
  const fab=document.getElementById('cartFab');
  badge.textContent=n; badge.classList.toggle('show',n>0);
  fab.classList.toggle('show',n>0);
  const fc=document.getElementById('fabCount'); if(fc) fc.textContent=n;
}

function updateModalBtn(id){
  const btn=document.getElementById('modalCartBtn'); if(!btn) return;
  if(isReg(id)){ btn.textContent='✓ REGISTERED'; btn.className='modal-cart-btn registered'; btn.onclick=null; return; }
  if(isPending(id)){ btn.textContent='⏳ PENDING VERIFICATION'; btn.className='modal-cart-btn pending'; btn.onclick=null; return; }
  const ic=isInCart(id);
  btn.textContent=ic?'✓ IN CART':'+ ADD TO CART';
  btn.className='modal-cart-btn'+(ic?' in-cart':'');
}

/* ── EVENT CARD: name + prize + 2 buttons only ── */
function renderCard(ev){
  const ic=isInCart(ev.id), ir=isReg(ev.id), ip=isPending(ev.id), so=isSoldOut(ev.id);
  const hp=ev.poster&&ev.poster.trim()!=='';

  /* prize line or free/open badge */
  let prizeBlock='';
  if(ev.prize){
    prizeBlock=`<div class="ev-prize"><span class="ev-prize-ico">🏆</span>${ev.prize}</div>`;
  } else if(ev.fee==='free'){
    prizeBlock=`<span class="ev-free">FREE ENTRY</span>`;
  }

  /* footer right — priority: sold out > registered > pending > cart/open */
  let footerRight;
  if(so){
    footerRight=`<button class="ev-soldout-btn" disabled>⊘ SOLD OUT</button>`;
  } else if(!ev.registration){
    footerRight=`<span class="ev-open-tag">OPEN TO ALL</span>`;
  } else if(ir){
    footerRight=`<button class="ev-cart-btn registered" disabled>✓ REGISTERED</button>`;
  } else if(ip){
    footerRight=`<button class="ev-cart-btn pending" disabled>⏳ PENDING</button>`;
  } else {
    footerRight=`<button class="ev-cart-btn ${ic?'in-cart':''}"
         onclick="event.stopPropagation();toggleCart('${ev.id}',event)">
         ${ic?'✓ IN CART':'+ CART'}
       </button>`;
  }

  return `<div class="event-card type-${ev.type}${so?' sold-out':''}" onclick="openModal('${ev.id}')">
    <div class="card-scan"></div>
    <div class="ev-poster">
      ${hp?`<img src="${ev.poster}" alt="${ev.name}" loading="lazy" decoding="async">`
          :`<div class="poster-ph"><div class="ph-icon">${ev.icon}</div><div class="ph-name">${ev.name}</div></div>`}
      <div class="poster-grad"></div>
      <span class="ev-type-tag">${ev.type.toUpperCase()}</span>
      ${so?`<div class="soldout-ribbon">SOLD OUT</div>`:(ip?`<div class="pending-ribbon">PENDING</div>`:'')}
    </div>
    <div class="ev-body">
      <div class="ev-name">${ev.name}</div>
      ${ev.subName?`<div class="ev-subname">${ev.subName}</div>`:''}
      ${prizeBlock}
    </div>
    <div class="ev-footer">
      <button class="ev-det-btn" onclick="event.stopPropagation();openModal('${ev.id}')">DETAILS</button>
      ${footerRight}
    </div>
  </div>`;
}

const GF_MAP={all:null,workshop:['workshop'],competition:['competition'],lecture:['session'],media:['media','creative']};
let activeGF='all';

function setGF(cat,btn){
  activeGF=cat;
  document.querySelectorAll('.gf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const notice=document.getElementById('filterNotice');
  const lbl=document.getElementById('filterLabel');

  cat==='all'?notice.classList.remove('show'):(notice.classList.add('show'),lbl.textContent=lmap[cat]||cat.toUpperCase());
  applyGF();
  const url=new URL(location); cat==='all'?url.searchParams.delete('category'):url.searchParams.set('category',cat);
  history.replaceState(null,'',url);
}

  renderAllGrid();
}

function updateGFCounts(){
  ['workshop','competition','lecture','media'].forEach(cat=>{
    const types=GF_MAP[cat];
    const n=types?EVENTS.filter(e=>types.includes(e.type)).length:EVENTS.length;
    const el=document.getElementById('gfc-'+cat); if(el) el.textContent='('+n+')';
  });

/* ── CARD ANIMATIONS ── */
function animCards(container){
  const cards=container.querySelectorAll('.event-card');
  cards.forEach((c,i)=>{ c.classList.remove('anim-ready'); c.style.animationDelay=(i*.065)+'s'; });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    cards.forEach(c=>c.classList.add('anim-ready'));
  }));
}

const cardObs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{ if(e.isIntersecting){ animCards(e.target); cardObs.unobserve(e.target); } });
},{threshold:.07,rootMargin:'0px 0px -36px 0px'});

  renderAllGrid();
  updateCartUI();
  updateGFCounts();
  document.querySelectorAll('.events-grid').forEach(g=>cardObs.observe(g));

});
/* ── Sponsor infinite marquee ── */
(function initSponsorMarquee() {
    const track = document.getElementById('evSponsorTrack');
    if (!track) return;

    /* Create a flex strip, move track into it, clone alongside */
    const strip = document.createElement('div');
    strip.style.cssText = 'display:flex;align-items:center;gap:50px;width:max-content;will-change:transform;';
    track.parentElement.insertBefore(strip, track);
    strip.appendChild(track);

    const clone = track.cloneNode(true);
    clone.removeAttribute('id');
    clone.querySelectorAll('[alt]').forEach(img => img.setAttribute('aria-hidden', 'true'));
    strip.appendChild(clone);

    let loopWidth = 0, pos = 0, raf = null, paused = false, lastTime = null;
    const SPEED = 60;

    function measure() {
        loopWidth = track.offsetWidth + 50; /* track width + gap */
    }

    function step(ts) {
        if (lastTime === null) lastTime = ts;
        const dt = ts - lastTime; lastTime = ts;
        if (!paused) {
            pos += SPEED * (dt / 1000);
            if (loopWidth > 0 && pos >= loopWidth) pos -= loopWidth;
            strip.style.transform = `translateX(-${pos}px)`;
        }
        raf = requestAnimationFrame(step);
    }

    function start() { measure(); lastTime = null; if (!raf) raf = requestAnimationFrame(step); }

    const scroll = track.parentElement;
    scroll.addEventListener('mouseenter', () => { paused = true; });
    scroll.addEventListener('mouseleave', () => { paused = false; lastTime = null; });
    window.addEventListener('resize', () => { measure(); }, { passive: true });

    const imgs = track.querySelectorAll('img');
    let loaded = 0;
    function onLoad() { if (++loaded === imgs.length) start(); }
    imgs.forEach(img => {
        if (img.complete) onLoad();
        else { img.addEventListener('load', onLoad); img.addEventListener('error', onLoad); }
    });
    if (loaded === imgs.length) start();
})();
</script>
